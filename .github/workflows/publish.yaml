name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/publish.yaml@master
    with:
      version: ${{ github.event.release.tag_name }}
      is-unstable: ${{ github.event.release.prerelease }}
    secrets:
      deploy-host: ${{ secrets.DEPLOY_HOST }}
      deploy-user: ${{ secrets.DEPLOY_USER }}
      deploy-key: ${{ secrets.DEPLOY_KEY }}

  update-manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install JPRM
        run: pip install jprm

      - name: Download Published Release Zip Asset
        run: |
          mkdir -p artifacts
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_NAME="${TAG_NAME#v}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="1.0.1.0"
          fi
          
          # Fetch release asset info from GitHub API
          RELEASE_JSON=$(curl -sH "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME}")
          
          ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for asset in data.get('assets', []):
              if asset['name'].endswith('.zip'):
                  print(asset['browser_download_url'])
                  break
          ")
          
          if [ -z "$ASSET_URL" ]; then
            echo "Error: No zip asset found in release ${TAG_NAME}"
            exit 1
          fi

          ZIP_NAME=$(basename "$ASSET_URL")
          echo "Downloading published asset: $ASSET_URL"
          curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" "$ASSET_URL" -o "artifacts/${ZIP_NAME}"
          echo "Downloaded zip MD5: $(md5sum artifacts/${ZIP_NAME})"

      - name: Update manifest.json with JPRM
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_NAME="${TAG_NAME#v}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="1.0.1.0"
          fi
          ZIP_FILE=$(ls artifacts/*.zip | head -n 1)
          ZIP_NAME=$(basename "$ZIP_FILE")
          PLUGIN_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${ZIP_NAME}"
          jprm repo add . "$ZIP_FILE" --plugin-url "$PLUGIN_URL"

      - name: Expand targetABIs for Jellyfin 10.11.X, 10.12.X, and 12.X
        run: |
          python3 -c "
          import json

          TARGET_ABIS = ['10.12.0.0', '10.11.0.0', '12.0.0.0']

          with open('manifest.json', 'r') as f:
              manifest = json.load(f)

          for plugin in manifest:
              new_versions = []
              seen = set()
              for v in plugin.get('versions', []):
                  ver_num = v['version']
                  source_url = v['sourceUrl']
                  for abi in TARGET_ABIS:
                      key = (ver_num, abi, source_url)
                      if key not in seen:
                          seen.add(key)
                          v_copy = dict(v)
                          v_copy['targetAbi'] = abi
                          new_versions.append(v_copy)
              plugin['versions'] = new_versions

          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=4)
          "

      - name: Clean up artifacts
        run: rm -rf artifacts

      - name: Commit and Push manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git status
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_NAME="${TAG_NAME#v}"
          git diff-index --quiet HEAD || (git commit -m "chore: update plugin manifest for release ${TAG_NAME}" && git push origin master)
