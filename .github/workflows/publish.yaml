name: "🚀 Publish Plugin"

on:
    release:
        types:
            - released
    workflow_dispatch:

permissions:
    contents: write
    packages: write

jobs:
    publish:
        uses: jellyfin/jellyfin-meta-plugins/.github/workflows/publish.yaml@master
        with:
            version: ${{ github.event.release.tag_name }}
            is-unstable: ${{ github.event.release.prerelease }}
        secrets:
            deploy-host: ${{ secrets.DEPLOY_HOST }}
            deploy-user: ${{ secrets.DEPLOY_USER }}
            deploy-key: ${{ secrets.DEPLOY_KEY }}

    update-manifest:
        needs: publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  ref: master

            - name: Download Published Release Zip Asset
              run: |
                  mkdir -p artifacts
                  TAG_NAME="${{ github.event.release.tag_name }}"
                  TAG_NAME="${TAG_NAME#v}"
                  if [ -z "$TAG_NAME" ]; then
                    TAG_NAME="1.0.3.0"
                  fi

                  # Fetch release asset info from GitHub API
                  RELEASE_JSON=$(curl -sH "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                    "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME}")

                  ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c "
                  import sys, json
                  data = json.load(sys.stdin)
                  for asset in data.get('assets', []):
                      if asset['name'].endswith('.zip'):
                          print(asset['browser_download_url'])
                          break
                  ")

                  if [ -z "$ASSET_URL" ]; then
                    echo "Error: No zip asset found in release ${TAG_NAME}"
                    exit 1
                  fi

                  ZIP_NAME=$(basename "$ASSET_URL")
                  echo "Downloading published asset: $ASSET_URL"
                  curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" "$ASSET_URL" -o "artifacts/${ZIP_NAME}"
                  echo "Downloaded zip MD5: $(md5sum artifacts/${ZIP_NAME})"

            - name: Add release version to manifest.json
              run: |
                  TAG_NAME="${{ github.event.release.tag_name }}"
                  TAG_NAME="${TAG_NAME#v}"
                  if [ -z "$TAG_NAME" ]; then
                    TAG_NAME="1.0.3.0"
                  fi
                  ZIP_FILE=$(ls artifacts/*.zip | head -n 1)
                  ZIP_NAME=$(basename "$ZIP_FILE")
                  PLUGIN_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${ZIP_NAME}"
                  python3 - "$ZIP_FILE" "$TAG_NAME" "$PLUGIN_URL" <<'PY'
                  import hashlib, json, sys, zipfile

                  TARGET_ABIS = ['10.12.0.0', '10.11.0.0', '12.0.0.0']

                  zip_file, version, source_url = sys.argv[1:4]

                  with zipfile.ZipFile(zip_file) as zf:
                      meta = json.loads(zf.read('meta.json'))
                  with open(zip_file, 'rb') as f:
                      checksum = hashlib.md5(f.read()).hexdigest()

                  if meta['version'] != version:
                      print(f"::warning::meta.json version {meta['version']} does not match release tag {version}; using the tag")

                  with open('manifest.json', 'r') as f:
                      manifest = json.load(f)

                  plugin = next((p for p in manifest if p['guid'] == meta['guid']), None)
                  if plugin is None:
                      plugin = {'guid': meta['guid'], 'versions': []}
                      manifest.append(plugin)
                  for key in ('name', 'description', 'overview', 'owner', 'category'):
                      plugin[key] = meta[key]

                  # Keep every other version; only drop entries for this exact version (re-run of the same release)
                  versions = [v for v in plugin.get('versions', []) if v['version'] != version]
                  for abi in TARGET_ABIS:
                      versions.append({
                          'version': version,
                          'changelog': meta['changelog'],
                          'targetAbi': abi,
                          'sourceUrl': source_url,
                          'checksum': checksum,
                          'timestamp': meta['timestamp'],
                      })
                  versions.sort(key=lambda v: tuple(int(x) for x in v['version'].split('.')), reverse=True)
                  plugin['versions'] = versions

                  with open('manifest.json', 'w') as f:
                      json.dump(manifest, f, indent=4)
                  PY

            - name: Clean up artifacts
              run: rm -rf artifacts

            - name: Commit and Push manifest.json
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add manifest.json
                  git status
                  TAG_NAME="${{ github.event.release.tag_name }}"
                  TAG_NAME="${TAG_NAME#v}"
                  git diff-index --quiet HEAD || (git commit -m "chore: update plugin manifest for release ${TAG_NAME}" && git push origin master)
